name: Update Gallery Manifest

on:
  # Lets Cloudinary (or anything else) trigger this instantly via webhook
  repository_dispatch:
    types: [cloudinary-update]

  # Fallback: also refresh once a day in case a webhook is ever missed
  schedule:
    - cron: '0 6 * * *'

  # Lets you trigger it manually from the Actions tab too
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch gallery data from Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node scripts/fetch-gallery.js

      - name: Commit updated manifest
        run: |
          git config user.name "gallery-bot"
          git config user.email "actions@github.com"
          git add public/gallery.json
          git diff --quiet --cached || git commit -m "Update gallery manifest"
          git push
